_schema-version: 3.3.0
ID: tutorial
version: 1.0.0
description: "A simple CAP project."
parameters:
  enable-parallel-deployments: true
  deploy_mode: html5-repo
build-parameters:
  before-all:
    - builder: custom
      commands:
        - npm ci
        - npx cds build --production
modules:
  - name: tutorial-srv
    type: nodejs
    path: gen/srv
    parameters:
      instances: 1
      buildpack: nodejs_buildpack
    build-parameters:
      builder: npm-ci
    provides:
      - name: srv-api # required by consumers of CAP services (e.g. approuter)
        properties:
          srv-url: ${default-url}
    requires:
      - name: tutorial-auth
      - name: tutorial-db
      - name: tutorial-destination

  - name: tutorial-db-deployer
    type: hdb
    path: gen/db
    parameters:
      buildpack: nodejs_buildpack
    requires:
      - name: tutorial-db

  - name: tutorial-app-deployer
    type: com.sap.application.content
    path: gen
    requires:
      - name: tutorial-auth
      - name: srv-api
      - name: tutorial-html5-repo-host
        parameters:
          content-target: true
          config:
            HTML5Runtime_enabled: true
    build-parameters:
      build-result: app/
      requires:
        - name: tutorialtutelem
          artifacts:
            - tutelem.zip
          target-path: app/
        - name: tutorialtutui5
          artifacts:
            - tutui5.zip
          target-path: app/

  - name: tutorialtutelem
    type: html5
    path: app/tutelem
    build-parameters:
      build-result: dist
      builder: custom
      commands:
        - npm ci
        - npm run build
      supported-platforms:
        []
  - name: tutorialtutui5
    type: html5
    path: app/tutui5
    build-parameters:
      build-result: dist
      builder: custom
      commands:
        - npm ci
        - npm run build
      supported-platforms:
        []

  - name: tutorial-destinations
    type: com.sap.application.content
    requires:
      - name: tutorial-auth
        parameters:
          service-key:
            name: tutorial-auth-key
      - name: tutorial-html5-repo-host
        parameters:
          service-key:
            name: tutorial-html5-repo-host-key
      - name: srv-api
      - name: tutorial-destination
        parameters:
          content-target: true
    build-parameters:
      no-source: true
    parameters:
      content:
        instance:
          existing_destinations_policy: update
          destinations:
            - Name: tutorial-html5-repository
              ServiceInstanceName: tutorial-html5-repo-host
              ServiceKeyName: tutorial-html5-repo-host-key
              sap.cloud.service: tutorial.service
            - Name: tutorial-auth
              Authentication: OAuth2UserTokenExchange
              ServiceInstanceName: tutorial-auth
              ServiceKeyName: tutorial-auth-key
              sap.cloud.service: tutorial.service
  - name: tutorial
    type: approuter.nodejs
    path: app/router
    parameters:
      keep-existing-routes: true
      disk-quota: 256M
      memory: 256M
    requires:
      - name: srv-api
        group: destinations
        properties:
          name: srv-api # must be used in xs-app.json as well
          url: ~{srv-url}
          forwardAuthToken: true
      - name: tutorial-auth
      - name: tutorial-destination
      - name: tutorial-html5-runtime
    provides:
      - name: app-api
        properties:
          app-protocol: ${protocol}
          app-uri: ${default-uri}

resources:
  - name: tutorial-auth
    type: org.cloudfoundry.managed-service
    parameters:
      service: xsuaa
      service-plan: application
      path: ./xs-security.json
      config:
        xsappname: tutorial-${org}-${space}
        tenant-mode: dedicated
        oauth2-configuration:
          credential-types:
            - "binding-secret"
            - "x509"
          redirect-uris:
            - https://*~{app-api/app-uri}/**
    requires:
      - name: app-api
  - name: tutorial-db
    type: com.sap.xs.hdi-container
    parameters:
      service: hana
      service-plan: hdi-shared

  - name: tutorial-html5-repo-host
    type: org.cloudfoundry.managed-service
    parameters:
      service: html5-apps-repo
      service-plan: app-host
  - name: tutorial-destination
    type: org.cloudfoundry.managed-service
    parameters:
      service: destination
      service-plan: lite
      config:
        HTML5Runtime_enabled: true
        init_data:
          instance:
            existing_destinations_policy: update
            destinations:
              - Name: srv-api
                URL: ~{srv-api/srv-url}
                Authentication: NoAuthentication
                Type: HTTP
                ProxyType: Internet
                HTML5.ForwardAuthToken: true
                HTML5.DynamicDestination: true
    requires:
      - name: srv-api
  - name: tutorial-html5-runtime
    type: org.cloudfoundry.managed-service
    parameters:
      service: html5-apps-repo
      service-plan: app-runtime
